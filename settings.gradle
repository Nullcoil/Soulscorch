pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

includeBuild('../nidalib') {
	dependencySubstitution {
		substitute module('maven.modrinth:nidalib') using project(':')
	}
}

// Should match your modid
rootProject.name = 'soulscorch'
